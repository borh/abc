[package]
name = "ab-coverage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coverage reporting and corpus-level metrics for Japanese text parsers"
repository = "https://github.com/your-org/ab-validator"
readme = "../../README.md"
keywords = ["japanese", "text-processing", "coverage", "dataset"]
categories = ["text-processing"]

[dependencies]
ab-encoding.workspace = true
ab-source-syntax.workspace = true
anyhow.workspace = true
clap.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
walkdir.workspace = true
zip.workspace = true

[[bin]]
name = "ab-coverage-merge"
path = "src/bin/merge.rs"

[[bin]]
name = "ab-coverage"
path = "src/bin/coverage.rs"

[[bin]]
name = "ab-source-inventory"
path = "src/bin/source_inventory.rs"

[[bin]]
name = "generate_taxonomy"
path = "src/bin/generate_taxonomy.rs"
