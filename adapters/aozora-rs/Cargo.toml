[package]
name = "aozora-rs-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ab-ir = { path = "../../crates/ab-ir" }
ab-source-syntax = { path = "../../crates/ab-source-syntax" }
anyhow = "1.0"
aozora-rs-core = { git = "https://github.com/kinoko0518/aozora-rs", package = "aozora-rs-core", tag = "v0.6.0" }
aozora-rs-gaiji = { git = "https://github.com/kinoko0518/aozora-rs", package = "aozora-rs-gaiji", tag = "v0.6.0" }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
winnow = "=0.7.15"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "adapter_bench"
harness = false

[patch."https://github.com/kinoko0518/aozora-rs"]
aozora-rs-gaiji = { path = "../../third_party/aozora-rs-gaiji" }

[workspace]
