# Separate workspace: test canonical output with serde_json/preserve_order
# without activating that feature in the publication workspace.
[package]
name = "preserve-order-canary"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ab-aat-to-parser-ir = { path = "../../crates/ab-aat-to-parser-ir" }
serde_json = { version = "1.0", features = ["preserve_order"] }
