# Aozora Bunko syntax coverage matrix.
#
# Schema (also documented in docs/superpowers/specs/2026-04-28-syntax-coverage-methodology.md):
#
# Each [[syntax]] row enumerates one Aozora Bunko syntactic feature. Required
# flat fields (id, priority, category, feature_keys, reference_sources,
# source_examples, source_patterns, ir_nodes, aat_nodes, tei_projection,
# plaintext_projection, comparison_projection, validation_properties,
# adapter_expectations, status, status_reason) match the SyntaxRow struct in
# crates/ab-index/src/syntax_coverage.rs.
#
# Each row also carries open-keyed parser/adapter sub-tables and a
# corpus_prevalence sub-table:
#
#   [syntax.parsers.<parser_id>]
#     recognition = parsed | normalised | unrecognised | aborts | unknown
#     evidence    = "<file>:<line>"
#     notes       = "..."
#
#   [syntax.adapters.<adapter_id>]
#     aat_fidelity = preserved | lossy | dropped | synthesised | not_applicable | unknown
#     evidence     = "<file>:<line>"
#     notes        = "..."
#
#   [syntax.corpus_prevalence]
#     works_with_feature = <int>
#     total_occurrences  = <int>
#     detector_id        = "<row_id>"
#     coverage_basis     = full_corpus | stratified_sample | not_run
#     sample_works       = ["<work_id>", ...]   # up to 5
#
# Adding a new parser/adapter is purely additive: append a new
# [syntax.parsers.<id>] / [syntax.adapters.<id>] sub-table per row.
#
# Forbidden combinations (to be enforced by crates/ab-coverage):
#   - recognition = "aborts"        => aat_fidelity must be "not_applicable"
#   - recognition = "parsed"        => aat_fidelity must NOT be "synthesised"
#   - recognition = "unrecognised"  => aat_fidelity must be "synthesised" or "not_applicable"

# =============================================================================
# Priority 1 rows (original 9; flat fields verbatim)
# =============================================================================

[[syntax]]
id = "ruby.basic"
priority = 1
category = "inline_annotation"
feature_keys = ["ruby", "ruby_prefix", "left_ruby"]
reference_sources = [
  "references/aozorabunko/rules/kijyunn.html",
]
source_examples = ["吾輩《わがはい》", "｜あのひと《...》", "［＃「左」の左に「ひだり」のルビ］"]
source_patterns = ['《[^》]+》', '｜[^《\n]+《[^》]+》', '［＃「[^」]+」の左に「[^」]+」のルビ］']
ir_nodes = ["Inline::Ruby"]
aat_nodes = ["ruby"]
tei_projection = "ruby/rb/rt"
plaintext_projection = "base_only"
comparison_projection = "base_only"
validation_properties = ["ruby_completeness", "semantic_ruby_sequence"]
adapter_expectations = ["preserve reading", "preserve base order", "distinguish left placement"]
oracle_cases = ["ruby.basic.simple", "ruby.gaiji.inline_base"]
status = "partial"
status_reason = "current ab-ir and AAT use a flat ruby base string"

