[package]
name = "ab-aozora-syntax"
description = "Aozora Bunko notation: AST types (ruby, bouten, 縦中横, 外字, kaeriten, indent containers). Internal crate; depend on the aozora umbrella crate instead."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
ab-aozora-spec = { path = "../ab-aozora-spec" }
ab-aozora-veb = { path = "../ab-aozora-veb" }
ab-aozora-encoding = { path = "../ab-aozora-encoding" }
thiserror = "2.0.18"
miette = "7.6.0"
phf = { version = "0.14", features = ["macros"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "ab-aozora-spec/serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
