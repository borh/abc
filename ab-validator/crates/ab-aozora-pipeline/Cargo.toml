[package]
name = "ab-aozora-pipeline"
description = "Aozora notation lex pipeline: orchestrator + lexer (sanitize → tokenize → pair → classify) producing an owned, lifetime-free AST. Internal crate; depend on the aozora umbrella crate instead."
version = "0.2.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
# Opt-in classify-stage sub-system instrumentation. When enabled, the
# `classify` recogniser entry points push their elapsed-ns
# into a thread-local `instrumentation::TimingTable` keyed by
# `Subsystem`. The `aozora-bench` `classify_subsystems` example reads
# this table. Default OFF: every guard collapses to dead code at
# compile time so release builds pay zero cost.
classify-instrument = []

[dependencies]
ab-aozora-spec = { path = "../ab-aozora-spec" }
ab-aozora-syntax = { path = "../ab-aozora-syntax" }
ab-aozora-encoding = { path = "../ab-aozora-encoding" }

# `aho-corasick` backs both the tokenize-stage trigger automaton and the
# classify-stage annotation classifier. `perf-literal` is what enables the
# packed (SIMD) matcher, and it is not implied by `std`: it must be requested
# here rather than arriving through feature unification with some other crate
# that happens to ask for it.
aho-corasick = { version = "1.1", default-features = false, features = [
    "std",
    "perf-literal",
] }
memchr = "2.8"
smallvec = "1.15"

[dev-dependencies]
hegeltest = "0.28"
proptest = "1.11"
ab-proptest = { path = "../ab-proptest" }
ab-aozora-render = { path = "../ab-aozora-render" }
insta = { version = "1.47", features = ["yaml", "json", "filters"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
