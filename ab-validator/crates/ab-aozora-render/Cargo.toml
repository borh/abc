[package]
name = "ab-aozora-render"
description = "HTML / serialisation renderers for the aozora AST. Internal crate; depend on the aozora umbrella crate instead."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
ab-aozora-spec = { path = "../ab-aozora-spec" }
ab-aozora-syntax = { path = "../ab-aozora-syntax" }
ab-aozora-pipeline = { path = "../ab-aozora-pipeline" }
memchr = "2.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.11"
ab-aozora-proptest = { path = "../ab-aozora-proptest" }
insta = { version = "1.47", features = ["yaml", "json", "filters"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
