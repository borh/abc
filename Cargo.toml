[workspace]
members = [
    "crates/ab-source-syntax",
    "crates/ab-ir",
    "crates/ab-index",
    "crates/ab-check",
    "crates/ab-compare",
    "crates/ab-coverage",
    "crates/ab-diff-utils",
    "crates/ab-morph-diff",
]
resolver = "2"
exclude = [
    "adapters/aozora2",
    "adapters/aozora-rs",
    "references",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
ab-diff-utils = { path = "crates/ab-diff-utils" }
ab-morph-diff = { path = "crates/ab-morph-diff" }
ab-ir = { path = "crates/ab-ir" }
ab-source-syntax = { path = "crates/ab-source-syntax" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8"
encoding_rs = "0.8"
flate2 = "1.0"
jsonschema = "0.46"
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tl = "0.7"
toml = "0.8"
toml_edit = "0.22"
unicode-normalization = "0.1"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
