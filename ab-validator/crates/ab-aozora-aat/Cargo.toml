[package]
name = "ab-aozora-aat"
description = "In-process AAT (Adapter Abstract Tree) emission for Aozora Bunko notation, ported from the frozen adapters/aozora wire-hop adapter onto ab-aozora-facade's entries feature"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[build-dependencies]
# build.rs only reads env / emits cargo directives; no deps needed.

[dependencies]
# Never enable `json` here: it turns on serde_json/preserve_order via
# ab-aozora-facade's feature graph (see the exclude-list comment in the
# root Cargo.toml). This crate only needs the typed, serde_json-free
# entries constructors.
ab-aozora-facade = { path = "../ab-aozora-facade", features = ["entries"] }
anyhow = "1.0"
regex = "1.12"
encoding_rs = "0.8"
# Ported verbatim from the frozen adapter's dependency surface; pinned
# exact per ADR 0032 (hard detach — no floating upstream). Replacing this
# with the fork's own ab-aozora-pipeline::lexer::sanitize is a recorded
# Phase 3 item under Phase 3's own gates (see
# docs/handoffs/2026-07-10-parser-fork-provenance.md).
aozora-pipeline = "=0.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
