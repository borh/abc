[package]
name = "aozora-epub3-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
regex = "1"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# Self-contained workspace: this crate is also excluded from the root
# workspace via `exclude` in `/Cargo.toml`. Declaring an (empty) workspace
# here makes the crate buildable from any checkout (main or a nested git
# worktree under .worktrees/), independent of ancestor workspace resolution.
[workspace]