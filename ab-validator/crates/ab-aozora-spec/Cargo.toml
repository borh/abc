[package]
name = "ab-aozora-spec"
description = "Aozora Bunko notation: canonical specification (sentinels, span, trigger/pair kinds, diagnostics). Internal crate; depend on the aozora umbrella crate instead."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
thiserror = "2.0.18"
miette = "7.6.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.11"
ab-aozora-proptest = { path = "../ab-aozora-proptest" }

[features]
default = []
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
