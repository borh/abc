[workspace]
members = [
    "crates/ab-index",
    "crates/ab-check",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8"
encoding_rs = "0.8"
flate2 = "1.0"
jsonschema = "0.46"
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tl = "0.7"
toml = "0.8"
unicode-normalization = "0.1"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
