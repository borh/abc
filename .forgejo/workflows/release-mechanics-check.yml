# Exercise runner transport and publication against a disposable fixture origin
# using public RFC 8032 keys. Repeated dispatches must converge to already-applied.
# The SSH deploy key remains a credential and is removed even on failure.
name: release-mechanics-check
on:
  workflow_dispatch: {}

jobs:
  governance-append:
    runs-on: nix-host
    steps:
      - name: check out the triggering commit
        # the dispatched SHA, not a floating branch: the reviewed
        # workflow must execute its own source even if main advances
        # between dispatch and clone
        run: |
          # scheme-agnostic: the runner may name the instance over http
          # (a loopback URL on the Forgejo host) or https
          helper='!f() { echo "username=x"; echo "password=${GITHUB_TOKEN}"; }; f'
          git -c credential.helper="$helper" clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src
          git -C src fetch origin "$FORGEJO_SHA"
          git -C src checkout --detach "$FORGEJO_SHA"
          test "$(git -C src rev-parse HEAD)" = "$FORGEJO_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: receive credentials and fixture inputs
        # the origin host key below is pinned from the declarative host
        # configuration, independently of any connection this job makes
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          umask 077
          printf '%s' "${{ secrets.SORANOHA_FIXTURE_DEPLOY_KEY }}" > deploy_key
          printf '%s' "${{ secrets.SORANOHA_FIXTURE_RELEASE_SEED }}" > release.seed
          printf '%s\n' '[speely.hyakutake-barbel.ts.net]:63333 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHMPfs2L/J7ei0SCng0EclKKIANQXhZQ19Tiw1FkvK7' > known_hosts
          export GIT_SSH_COMMAND="/run/current-system/sw/bin/ssh -i $PWD/deploy_key -o UserKnownHostsFile=$PWD/known_hosts -o StrictHostKeyChecking=yes"
          git clone ssh://forgejo@speely.hyakutake-barbel.ts.net:63333/bor/soranoha-f12-race.git chain
          git -C chain fetch origin fixture-inputs
          for f in event.json event.sig release.pub governance.pub; do
            git -C chain cat-file blob "FETCH_HEAD:$f" > "$f"
          done

      - name: append the fixture event through the transaction
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          export GIT_SSH_COMMAND="/run/current-system/sw/bin/ssh -i $PWD/deploy_key -o UserKnownHostsFile=$PWD/known_hosts -o StrictHostKeyChecking=yes"
          run_once() {
            nix run ./src#soranoha-kernel -- governance \
              --chain-clone "$PWD/chain" \
              --branch main \
              --event "$PWD/event.json" \
              --event-sig "$PWD/event.sig" \
              --release-pub "$PWD/release.pub" \
              --governance-pub "$PWD/governance.pub" \
              --release-key "$PWD/release.seed"
          }
          # both outcomes exit 0, so the deterministic JSON is what
          # distinguishes a publish from a duplicate: the first dispatch
          # publishes (later dispatches find the event applied), and the
          # second invocation must be exactly already-applied
          first="$(run_once)"
          printf '%s\n' "$first"
          printf '%s' "$first" | grep -E '"outcome": "(published|already-applied)"'
          second="$(run_once)"
          printf '%s\n' "$second"
          printf '%s' "$second" | grep -F '"outcome": "already-applied"'

      - name: remove credential files
        if: always()
        run: rm -f deploy_key release.seed
