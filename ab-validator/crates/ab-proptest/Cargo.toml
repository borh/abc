[package]
name = "ab-proptest"
description = "Aozora-shaped proptest input generators and shared proptest configuration for the workspace's property suites. Dev-only; never linked into a released binary."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
ab-aozora-spec = { path = "../ab-aozora-spec" }
proptest = "1.11"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
