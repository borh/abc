# Manually dispatched publication on the dedicated repository runner.
# The private tailnet deployment uses the ordinary signed release path.
# Public exposure requires the fresh-genesis procedure in
# docs/private-publication.md.
#
# The contract carried here:
#   - runs ONLY on the dedicated repository-scoped runner (label
#     soranoha-release; registration verified server-side as bound to this
#     repository alone).
#   - the ONLY workflow secret is the release signing seed
#     (SORANOHA_RELEASE_SEED). The workflow creates NO plaintext key file
#     (so no cleanup step a crash could skip) and BUILD CHILDREN DO NOT
#     INHERIT THE SEED: it is copied to a non-exported shell variable, the
#     exported binding is unset, and the value is piped to the kernel's
#     stdin with the variable additionally scrubbed from the child
#     environment. (Verified: the hermetic wrapper preserves stdin; a piped
#     wrong seed fails at the seed-pin correspondence check.)
#   - deployment paths, SSH transport, role pins and directory provisioning
#     belong to the NixOS publisher profile. The kernel reads its non-secret
#     /etc/soranoha/publisher.json configuration and performs input preflight.
#   - Clojure verifies exports and switches current atomically.
#   - exit contract: release exits 0 on published/already-published (then
#     the serving tree is exported and `current` re-pointed), 3 on requeue
#     (clean stop — the next scheduled run retries from the new head),
#     anything else fails the job.
name: scheduled-release
on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: soranoha-release
    steps:
      - name: check out the triggering commit
        # the dispatched SHA, not a floating branch: the job must execute
        # its own source even if main advances between dispatch and clone
        run: |
          helper='!f() { echo "username=x"; echo "password=${GITHUB_TOKEN}"; }; f'
          git -c credential.helper="$helper" clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src
          git -C src fetch origin "$FORGEJO_SHA"
          git -C src checkout --detach "$FORGEJO_SHA"
          test "$(git -C src rev-parse HEAD)" = "$FORGEJO_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: release
        env:
          SORANOHA_RELEASE_SEED: ${{ secrets.SORANOHA_RELEASE_SEED }}
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          _soranoha_release_seed="$SORANOHA_RELEASE_SEED"
          export -n _soranoha_release_seed
          unset SORANOHA_RELEASE_SEED
          set +e
          printf '%s' "$_soranoha_release_seed" |
            env -u SORANOHA_RELEASE_SEED -u _soranoha_release_seed nix run ./src#soranoha-kernel -- release \
            --deployment /etc/soranoha/publisher.json \
            --assets-root "$PWD/src/soranoha" \
            --assessment "$PWD/src/soranoha/data/assessment-snapshot.json" \
            --assessment-source "$PWD/src/soranoha/data/assessment-source.json" \
            --as-of "$(date -u +%F)" \
            --policy "$PWD/src/soranoha/data/publication-policy.edn" \
            --release-key /dev/stdin
          rc=$?
          set -e
          echo "$rc" > release.rc
          case "$rc" in
            0) echo "release: published or already-published" ;;
            3) echo "release: requeue — the next scheduled run retries from the new head" ;;
            *) exit "$rc" ;;
          esac

      - name: activate the verified serving tree
        run: |
          test "$(cat release.rc)" = 0 || { echo "skipping activation (requeue)"; exit 0; }
          export PATH="/run/current-system/sw/bin:$PATH"
          nix run ./src#soranoha-kernel -- serving-activate \
            --deployment /etc/soranoha/publisher.json
