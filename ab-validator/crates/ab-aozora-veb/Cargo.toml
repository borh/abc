[package]
name = "ab-aozora-veb"
description = "Cache-friendly sorted-collection lookup for the aozora pipeline (Eytzinger layout, no_std). Internal crate; depend on the aozora umbrella crate instead."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
# (none) — core algorithm is no_std + alloc only.

[dev-dependencies]
proptest = "1.11"
ab-aozora-proptest = { path = "../ab-aozora-proptest" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
