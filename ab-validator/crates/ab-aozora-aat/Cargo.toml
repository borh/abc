[package]
name = "ab-aozora-aat"
description = "In-process AAT (Adapter Abstract Tree) emission for Aozora Bunko notation, ported from the frozen adapters/aozora wire-hop adapter onto ab-aozora-facade's entries feature"
version = "0.6.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[build-dependencies]
# build.rs only reads env / emits cargo directives; no deps needed.

[dependencies]
# Never enable `json` here: it turns on serde_json/preserve_order via
# ab-aozora-facade's feature graph (see the exclude-list comment in the
# root Cargo.toml). This crate only needs the typed, serde_json-free
# entries constructors.
ab-aozora-facade = { path = "../ab-aozora-facade", features = ["entries"] }
anyhow = "1.0"
regex = "1.12"
encoding_rs = "0.8"
# Fork-owned sanitize (Phase 3 stage 0): the crates.io aozora-pipeline
# =0.4.1 dependency is retired; ab_aozora_pipeline::lexer::sanitize is the
# 1a4f864-lifted implementation, byte-equivalence proven corpus-wide in
# docs/superpowers/reports/2026-07-11-phase3-stage0-sanitize-parity.md.
ab-aozora-pipeline = { path = "../ab-aozora-pipeline" }
ab-rq-artifact-store = { path = "../ab-rq-artifact-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
# Phase 5 Task 5: bare-toggle model mirror + property test target
# (tests/bare_toggle_model.rs). Workspace-pinned at 1.5
# (ab-validator/Cargo.toml:201) — never add a second literal version here.
proptest.workspace = true
hegeltest = "0.28"
tempfile.workspace = true
