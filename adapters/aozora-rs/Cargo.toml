[package]
name = "aozora-rs-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ab-ir = { path = "../../crates/ab-ir" }
ab-source-syntax = { path = "../../crates/ab-source-syntax" }
anyhow = "1.0"
aozora-rs-core = { git = "https://github.com/kinoko0518/aozora-rs", package = "aozora-rs-core", rev = "2b4e8d16886350e99cff5118b2f6dfd0bc26721a" }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
gaiji-chuki-parser = { git = "https://github.com/kinoko0518/aozora-rs", package = "gaiji-chuki-parser", rev = "2b4e8d16886350e99cff5118b2f6dfd0bc26721a" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
winnow = "=0.7.15"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "adapter_bench"
harness = false

[workspace]
