[package]
name = "ab-aozora-encoding"
description = "Aozora Bunko notation: Shift_JIS decoding and gaiji (外字) resolution. Internal crate; depend on the aozora umbrella crate instead."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
encoding_rs = "0.8.35"
thiserror = "2.0.18"
miette = "7.6.0"
# Runtime PHF — `default-features = false` strips the proc-macro backend;
# the gaiji table is emitted via `phf_codegen` in `build.rs` and the
# runtime uses only `phf::Map`, consumed by the `include!`d codegen output.
# cargo-shear's source scan cannot see that generated usage — see the
# `[package.metadata.cargo-shear]` ignore at the foot of this manifest.
phf = { version = "0.14", default-features = false }

[build-dependencies]
# Codegen-time PHF builder — runs in `build.rs` to emit the gaiji
# tables (~13 k entries) as a Rust source fragment included via
# `include!()`. Moves the perfect-hash construction out of the
# rustc proc-macro phase, which on the macro path was ~30–60 s of
# `cargo check` time on cold caches.
#
# Ad hoc version pin — not present in upstream `[workspace.dependencies]`
# either; carried verbatim per Task 2 provenance handoff.
phf_codegen = "0.14"

[dev-dependencies]
proptest = "1.11"

[package.metadata.cargo-shear]
# `phf` is used only through the `build.rs`-generated, `include!`d gaiji
# table (`phf::Map`), invisible to cargo-shear's source scan.
ignored = ["phf"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
