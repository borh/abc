[package]
name = "aozora-rs-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ab-ir = { path = "../../crates/ab-ir" }
ab-source-syntax = { path = "../../crates/ab-source-syntax" }
anyhow = "1.0"
aozora-rs-core = { path = "../../references/parsers/aozora-rs/aozora-rs/aozora-rs-core" }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
gaiji-chuki-parser = { path = "../../references/parsers/aozora-rs/aozora-rs/aozora-rs-gaiji/gaiji-chuki-parser" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
winnow = "=0.7.15"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "adapter_bench"
harness = false

[workspace]
