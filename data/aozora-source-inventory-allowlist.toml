# Reviewed source markers that are inventory-visible but do not block the v1
# representability gate. Each entry must match by kind plus either body_pattern
# or raw_pattern. Use this only for out-of-body, malformed corpus noise, or
# intentionally unsupported-v1 markers.

[[allow]]
id = "terminal-provenance-note"
kind = "SegmentBoundaryTerminalProvenance"
raw_pattern = "^［＃地付き］"
scope = "out_of_body"
reason = "Terminal bibliography/provenance metadata is not body AAT."
evidence = "docs/aat-contract.md"

[[allow]]
id = "boilerplate-empty-command-legend"
kind = "CommandFullwidth"
raw_pattern = "^［＃］$"
scope = "malformed_noise"
reason = "Empty fullwidth command marker occurs in Aozora boilerplate that explains input annotations, not as body transcription markup."
evidence = "docs/superpowers/reports/2026-07-04-source-authority-representability.md"

[[allow]]
id = "boilerplate-kaeriten-placeholder"
kind = "CommandFullwidth"
raw_pattern = "^［＃…］$"
scope = "out_of_body"
reason = "Aozora header legends use this placeholder to explain return-point notation; it is not body transcription markup."
evidence = "scratch/ab-index.json:000038_1408"

