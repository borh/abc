[package]
name = "aozora-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
aozora-pipeline = { path = "../../references/parsers/aozora/crates/aozora-pipeline" }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
jsonschema = "0.46"

[workspace]
