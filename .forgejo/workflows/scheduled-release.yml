# Publish on the repository-scoped runner using the NixOS deployment config.
# The signing seed reaches only the release process through stdin; build children
# must not inherit it. Public exposure follows docs/private-publication.md.
# Release exit 3 requests a retry from the new head; other failures stop the job.
# release-needed exit 10 means the corpus did not move, so no release is minted.
name: scheduled-release
on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: soranoha-release
    steps:
      - name: check out the triggering commit
        # the dispatched SHA, not a floating branch: the job must execute
        # its own source even if main advances between dispatch and clone
        run: |
          helper='!f() { echo "username=x"; echo "password=${GITHUB_TOKEN}"; }; f'
          git -c credential.helper="$helper" clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src
          git -C src fetch origin "$FORGEJO_SHA"
          git -C src checkout --detach "$FORGEJO_SHA"
          test "$(git -C src rev-parse HEAD)" = "$FORGEJO_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: decide whether the corpus moved
        # A release is minted when a work archive changed, not on every
        # upstream commit: about 800 of aozorabunko's commits touch none, and
        # a release for one of those costs a 9.1 MB manifest and a 14.45 MB
        # catalog to record a different revision. `corpus.covers_from` is what
        # maps those revisions to the release that covers them.
        # The command verifies the head before reading its revision and reports
        # `needed` on any uncertainty, so a skip only happens on a comparison
        # that succeeded.
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          set +e
          nix run ./src#soranoha-kernel -- release-needed \
            --deployment /etc/soranoha/publisher.json
          rc=$?
          set -e
          case "$rc" in
            0) : ;;
            10) echo "release: skipped, the corpus did not move" ; touch skip-release ;;
            *) exit "$rc" ;;
          esac

      - name: check the committed snapshot against the selection
        # A selection or assessment change that lands without regenerating
        # soranoha/data/assessment-snapshot.json stops the release with a
        # totality violation after the chain is already fetched and verified.
        # The same comparison here fails first, and names the slugs that
        # differ, so the fix is to regenerate and commit the snapshot.
        run: |
          test ! -f skip-release || { echo "skipping snapshot check (corpus unmoved)"; exit 0; }
          export PATH="/run/current-system/sw/bin:$PATH"
          nix run ./src#soranoha-kernel -- assessment-drift \
            --deployment /etc/soranoha/publisher.json \
            --assessment "$PWD/src/soranoha/data/assessment-snapshot.json" \
            --assessment-source "$PWD/src/soranoha/data/assessment-source.json" \
            --as-of "$(date -u +%F)"

      - name: release
        env:
          SORANOHA_RELEASE_SEED: ${{ secrets.SORANOHA_RELEASE_SEED }}
        run: |
          test ! -f skip-release || { echo "skipping release (corpus unmoved)"; echo skip > release.rc; exit 0; }
          export PATH="/run/current-system/sw/bin:$PATH"
          _soranoha_release_seed="$SORANOHA_RELEASE_SEED"
          export -n _soranoha_release_seed
          unset SORANOHA_RELEASE_SEED
          set +e
          printf '%s' "$_soranoha_release_seed" |
            env -u SORANOHA_RELEASE_SEED -u _soranoha_release_seed nix run ./src#soranoha-kernel -- release \
            --deployment /etc/soranoha/publisher.json \
            --assets-root "$PWD/src/soranoha" \
            --assessment "$PWD/src/soranoha/data/assessment-snapshot.json" \
            --assessment-source "$PWD/src/soranoha/data/assessment-source.json" \
            --as-of "$(date -u +%F)" \
            --policy "$PWD/src/soranoha/data/publication-policy.edn" \
            --release-key /dev/stdin
          rc=$?
          set -e
          echo "$rc" > release.rc
          case "$rc" in
            0) echo "release: published or already-published" ;;
            3) echo "release: requeue — the next scheduled run retries from the new head" ;;
            *) exit "$rc" ;;
          esac

      - name: activate the verified serving tree
        run: |
          test "$(cat release.rc)" = 0 || { echo "skipping activation (requeue or unmoved corpus)"; exit 0; }
          export PATH="/run/current-system/sw/bin:$PATH"
          nix run ./src#soranoha-kernel -- serving-activate \
            --deployment /etc/soranoha/publisher.json
