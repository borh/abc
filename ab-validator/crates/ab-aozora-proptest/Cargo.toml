[package]
name = "ab-aozora-proptest"
description = "Proptest strategies (Aozora-shaped input generators) for the aozora parser. Internal crate; reach it via the aozora crate's `proptest` feature."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
proptest = "1.11"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
